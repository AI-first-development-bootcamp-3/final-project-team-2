name: CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-mobile:
    name: Deploy Mobile
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Create Vercel project config
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_MOBILE_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --token=$VERCEL_TOKEN
          fi

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

