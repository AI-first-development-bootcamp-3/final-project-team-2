name: CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-mobile:
    name: Deploy Mobile
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MOBILE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prod --token=$VERCEL_TOKEN)
          else
            URL=$(vercel deploy --token=$VERCEL_TOKEN)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prod --token=$VERCEL_TOKEN)
          else
            URL=$(vercel deploy --token=$VERCEL_TOKEN)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prod --token=$VERCEL_TOKEN)
          else
            URL=$(vercel deploy --token=$VERCEL_TOKEN)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
