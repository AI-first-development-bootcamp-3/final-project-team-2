name: CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-mobile:
    name: Deploy Mobile
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@^59.0.0

      - name: Create Vercel project config
        run: |
          mkdir -p apps/mobile/.vercel
          echo '{"projectId":"${{ secrets.VERCEL_MOBILE_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > apps/mobile/.vercel/project.json

      - name: Deploy
        working-directory: apps/mobile
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --token=$VERCEL_TOKEN
          fi

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@^59.0.0

      - name: Create Vercel project config
        run: |
          mkdir -p apps/admin/.vercel
          echo '{"projectId":"${{ secrets.VERCEL_ADMIN_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > apps/admin/.vercel/project.json

      - name: Deploy
        working-directory: apps/admin
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --token=$VERCEL_TOKEN
          fi

  migrate:
    name: Run Migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: server/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: Deploy API
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@^59.0.0

      - name: Create Vercel project config
        run: |
          mkdir -p server/api/.vercel
          echo '{"projectId":"${{ secrets.VERCEL_API_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > server/api/.vercel/project.json

      - name: Deploy
        working-directory: server/api
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --token=$VERCEL_TOKEN
          fi
