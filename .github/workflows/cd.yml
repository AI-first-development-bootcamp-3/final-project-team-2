name: CD

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - "e2e/**"
  pull_request:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - "e2e/**"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    name: Wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI workflow on commit ${{ github.sha }}..."
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(gh run list --repo "${{ github.repository }}" \
              --commit "${{ github.sha }}" \
              --workflow "CI" \
              --json conclusion \
              --jq '.[0].conclusion // "pending"')
            echo "CI status: $STATUS (attempt $i/20)"
            case "$STATUS" in
              success) echo "CI passed!"; exit 0 ;;
              failure|cancelled) echo "CI did not pass. Aborting deploy."; exit 1 ;;
            esac
          done
          echo "Timed out waiting for CI (10 minutes)"
          exit 1

  guard:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.result }}
    steps:
      - name: Block fork PRs (secrets unavailable)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Fork PR detected — skipping deploy (secrets are unavailable)"
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Run Migrations
    needs: [ci-gate, guard]
    if: |
      always() &&
      needs.guard.outputs.should-deploy == 'true' &&
      needs.guard.result == 'success' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: server/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: [ci-gate, guard, migrate]
    if: |
      always() &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.should-deploy == 'true' &&
      (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mobile
            directory: apps/mobile
            project-id-secret: VERCEL_MOBILE_PROJECT_ID
          - name: Admin
            directory: apps/admin
            project-id-secret: VERCEL_ADMIN_PROJECT_ID
          - name: API
            directory: server/api
            project-id-secret: VERCEL_API_PROJECT_ID
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@^59.0.0

      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project-id-secret] }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --token=$VERCEL_TOKEN
          fi
