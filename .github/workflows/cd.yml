name: CD

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - "e2e/**"
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - "e2e/**"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.result }}
    steps:
      - name: Block fork PRs (secrets unavailable)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Fork PR detected — skipping deploy (secrets are unavailable)"
            echo "result=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::error::Required secrets (VERCEL_TOKEN, VERCEL_ORG_ID) are missing or empty"
            exit 1
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Run Migrations
    needs: [guard]
    if: |
      needs.guard.outputs.should-deploy == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: server/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: [guard, migrate]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.should-deploy == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mobile
            directory: apps/mobile
            project-id-secret: VERCEL_MOBILE_PROJECT_ID
            staging-alias: timesheet-mobile-staging-abra.vercel.app
          - name: Admin
            directory: apps/admin
            project-id-secret: VERCEL_ADMIN_PROJECT_ID
            staging-alias: timesheet-admin-staging-abra.vercel.app
          - name: API
            directory: server/api
            project-id-secret: VERCEL_API_PROJECT_ID
            staging-alias: timesheet-api-staging-abra.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@^59.0.0

      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project-id-secret] }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploys run on push events only (see the job's `if`). Push to main
          # is production; push to staging is a preview whose stable alias is
          # re-pointed below, so the *-staging-abra.vercel.app URLs (which the
          # staging admin bundle bakes in) always serve the latest staging
          # code without manual re-aliasing.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN
          else
            url=$(vercel deploy --token=$VERCEL_TOKEN)
            echo "deployed $url"
            if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              vercel alias set "$url" "${{ matrix.staging-alias }}" --token=$VERCEL_TOKEN
            fi
          fi
