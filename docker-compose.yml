# Graded dev runtime (GENERAL_SPEC ADR-16/ADR-18): `docker compose up --build`
# brings up Postgres + API + both frontends. Production is Vercel — these
# images never ship. Compose-level variables come from ./.env (see .env.example).

name: timesheet-abra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-timesheet}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abra} -d ${POSTGRES_DB:-timesheet}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-abra}:${POSTGRES_PASSWORD:-abra_dev_password}@postgres:5432/${POSTGRES_DB:-timesheet}
      CORS_ORIGINS: http://localhost:${MOBILE_PORT:-5173},http://localhost:${ADMIN_PORT:-5174}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  mobile:
    build:
      context: .
      target: mobile
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}/api/v1
    ports:
      - '${MOBILE_PORT:-5173}:5173'
    depends_on:
      - api

  admin:
    build:
      context: .
      target: admin
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}/api/v1
    ports:
      - '${ADMIN_PORT:-5174}:5174'
    depends_on:
      - api

volumes:
  pgdata:
